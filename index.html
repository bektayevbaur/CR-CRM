<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clean Republic CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2ee;--card:#ffffff;--ink:#15161a;--muted:#6c707a;--line:#e3e1db;--soft:#f7f6f3;
  --accent:#2251ff;--accent-soft:#e8edff;--ok:#11875d;--ok-soft:#e3f5ec;--warn:#b86e00;--warn-soft:#fdf1dc;
  --bad:#c8322b;--bad-soft:#fde8e6;--violet:#6b3fd4;--violet-soft:#efe9fd;
  --r:16px;--shadow:0 1px 2px rgba(20,20,30,.05),0 6px 24px rgba(20,20,30,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(243,242,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
.brand b{display:block;font-size:15px}
.brand small{display:block;font-size:11.5px;color:var(--muted)}
.brand small.on{color:var(--ok)}
.top select{max-width:46vw;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:4px;background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:150px;border:0;background:none;padding:6px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--ink)}
.tabs button.plus span.ic{width:44px;height:30px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center}
.tabs button.plus.on span.ic{background:var(--ink)}
h1{font-size:24px;margin:4px 0 14px;letter-spacing:-.3px}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.grid3{grid-template-columns:1fr 1fr}}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:12px;font-size:15px;color:var(--ink);outline:none;font-weight:500}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#fff}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.sm{padding:5px 10px;font-size:12.5px}
.chip .dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:10px 6px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button.on.yes{background:var(--ok);color:#fff}
.seg button.on.no{background:var(--bad);color:#fff}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--soft);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.ghost{background:none}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.wa{background:#1fa855;color:#fff;border-color:#1fa855}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.st-new{background:var(--accent-soft);color:var(--accent)}
.st-work{background:var(--violet-soft);color:var(--violet)}
.st-ready{background:var(--ok-soft);color:var(--ok)}
.st-done{background:#ececec;color:#555}
.st-cancel{background:var(--bad-soft);color:var(--bad)}
.pay-no{background:var(--bad-soft);color:var(--bad)}
.pay-part{background:var(--warn-soft);color:var(--warn)}
.pay-ok{background:var(--ok-soft);color:var(--ok)}
.orig-yes{background:var(--ok-soft);color:var(--ok)}
.orig-no{background:var(--bad-soft);color:var(--bad)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:200px}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.olist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ocard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;gap:12px;cursor:pointer;border:1px solid transparent}
.ocard:hover{border-color:var(--line)}
.thumb{width:72px;height:72px;border-radius:12px;background:var(--soft);flex:none;overflow:hidden;display:grid;place-items:center;color:#b8b6af}
.thumb img{width:100%;height:100%;object-fit:cover}
.ocard .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ocard .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{background:var(--soft);border-radius:999px;padding:1px 7px;font-size:11.5px;margin-left:2px}
.chip.on .count{background:rgba(255,255,255,.2)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.section{margin-bottom:14px}
.photos{display:flex;gap:10px;flex-wrap:wrap}
.ph{position:relative;width:92px;height:92px;border-radius:14px;overflow:hidden;background:var(--soft)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.ph .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:24px}
.ph.loading{display:grid;place-items:center;font-size:11px;color:var(--muted)}
.addph{width:92px;height:92px;border-radius:14px;border:1.5px dashed #c9c6be;display:grid;place-items:center;text-align:center;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;background:var(--card)}
.addph svg{width:24px;height:24px;display:block;margin:0 auto 4px}
.slider{width:100%;accent-color:var(--accent)}
.dirt{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dirt b{font-size:15px}
.dirtbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 2px}
.dirtbar i{height:8px;border-radius:4px;background:var(--line)}
.dirtbar i.f1{background:#9bd3b5}.dirtbar i.f2{background:#c9d77a}.dirtbar i.f3{background:#f0c050}.dirtbar i.f4{background:#ec8c3c}.dirtbar i.f5{background:#d9493c}
.tariffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tariff{border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;background:var(--card);position:relative}
.tariff b{display:block;font-size:13.5px}
.tariff span{font-size:13px;color:var(--muted);font-weight:600}
.tariff.on{border-color:var(--accent);background:var(--accent-soft)}
.tariff .hint{position:absolute;top:-8px;right:8px;background:var(--warn);color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}
.svc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--card)}
.svc.on{border-color:var(--accent);background:var(--accent-soft)}
.svc input{width:18px;height:18px;accent-color:var(--accent)}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.box{border:1px solid var(--line);border-radius:10px;padding:9px 0;text-align:center;font-weight:700;font-size:13px;cursor:pointer;background:var(--card)}
.box.busy{background:var(--soft);color:#bbb;cursor:not-allowed;text-decoration:line-through}
.box.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sum{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));z-index:5;background:var(--ink);color:#fff;border-radius:18px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.sum .lbl{font-size:12px;opacity:.7}
.sum .val{font-size:22px;font-weight:800}
.sum .btn{background:var(--accent);color:#fff;border:0}
.found{display:flex;align-items:center;gap:10px;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.found.newc{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .h{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px}
.bar .tr{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:4px}
.clist{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex:none}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(15,16,20,.45)}
.sheet-body{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheet{align-items:center}.sheet-body{border-radius:22px;max-height:88vh}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.close{border:0;background:var(--card);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;box-shadow:var(--shadow);flex:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;text-align:right}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.9);display:grid;place-items:center}
.lightbox img{max-width:96vw;max-height:90vh;border-radius:8px}
.nz{background:#fff;color:#16171b;font-family:Manrope,sans-serif;padding:34px 38px;width:100%;max-width:794px;margin:0 auto;font-size:12.5px;line-height:1.45;border-radius:10px;box-shadow:var(--shadow)}
.nz .nzh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #16171b;padding-bottom:14px;margin-bottom:16px}
.nz .co{display:flex;gap:12px;align-items:center}
.nz .co .lg{width:44px;height:44px;border-radius:12px;background:#16171b;color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
.nz .co b{font-size:17px;display:block}
.nz .num{text-align:right}
.nz .num .t{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#777;font-weight:700}
.nz .num .n{font-size:24px;font-weight:800;letter-spacing:-.4px}
.nz .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.nz .blk{border:1px solid #e2e0da;border-radius:10px;padding:10px 12px}
.nz .blk h4{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#888}
.nz table{width:100%;border-collapse:collapse}
.nz td{padding:3px 0;vertical-align:top}
.nz td.k{color:#777;width:44%}
.nz td.v{font-weight:600}
.nz .prices td{padding:6px 0;border-bottom:1px solid #eee}
.nz .prices td.r{text-align:right;font-weight:600;white-space:nowrap}
.nz .prices tr.tot td{border-bottom:0;border-top:2px solid #16171b;font-size:15px;font-weight:800;padding-top:8px}
.nz .phs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.nz .phs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.nz .dl{display:flex;gap:3px;margin-top:3px}.nz .dl i{flex:1;height:6px;border-radius:3px;background:#e6e4de}
.nz .terms{font-size:10.5px;color:#555;margin:14px 0 0;padding-left:16px}
.nz .terms li{margin-bottom:3px}
.nz .sign{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px;font-size:11px;color:#666}
.nz .sign div{border-top:1px solid #16171b;padding-top:5px}
.nz .foot{margin-top:16px;text-align:center;font-size:10px;color:#999}
@media (max-width:560px){.nz{padding:20px 16px;font-size:11.5px}.nz .cols{grid-template-columns:1fr}.nz .phs{grid-template-columns:repeat(3,1fr)}}
#nzCapture{position:fixed;left:-10000px;top:0;width:794px}
#nzCapture .nz{max-width:none;width:794px;box-shadow:none;border-radius:0;padding:34px 38px;font-size:12.5px}
#nzCapture .nz .cols{grid-template-columns:1fr 1fr}#nzCapture .nz .phs{grid-template-columns:repeat(6,1fr)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}
.hr{height:1px;background:var(--line);margin:4px 0}
.paylist{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.paylist div{display:flex;justify-content:space-between}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">CR</span><div><b>Clean Republic</b><small id="sync">подключение…</small></div></div>
  <select id="pointSel" aria-label="Точка"></select>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="7" height="16" rx="2"/><rect x="14" y="4" width="7" height="10" rx="2"/></svg>Заказы</button>
  <button data-tab="clients"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8M22 21c0-3-1.5-5-4-5.7"/></svg>Клиенты</button>
  <button data-tab="new" class="plus"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="width:20px;height:20px"><path d="M12 5v14M5 12h14"/></svg></span>Приём</button>
  <button data-tab="cash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Касса</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Настройки</button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-close="1"></div><div class="sheet-body" id="sheetBody"></div></div>
<div id="toast"></div>

<script>
/* ===================== Справочники по умолчанию ===================== */
const DEFAULTS = {
  tariffs:[{name:'STANDARD',price:5990},{name:'PREMIUM',price:6990},{name:'FROST MODE',price:8990},{name:'EXTRA',price:0}],
  services:[{name:'Отбеливание подошвы',price:2000},{name:'Покраска замши/нубука',price:3000},{name:'Защитная пропитка',price:1500},{name:'Удаление запаха',price:1000},{name:'Замена шнурков',price:500},{name:'Подклейка подошвы',price:2500}],
  points:['Clean Rep','VICCO','BRUX','Nike Outlet','All Stars Mega Alma-Ata'],
  masters:['Руслан'], managers:['Камила','Мариям'],
  channels:['Instagram','2GIS','WhatsApp','Рекомендация','Повторный клиент','Проходил мимо','Партнёр (точка)','Другое'],
  boxes:60, masterRate:600, masterFixed:120000, extraBrands:[],
  company:'Clean Republic', companyInfo:'Химчистка и уход за обувью · Алматы', companyPhone:'',
  terms:['Клиент ознакомлен с состоянием обуви. Дефекты, отмеченные в наряд-заказе и на фото, имелись до чистки.',
    'Исполнитель не отвечает за скрытые дефекты, проявившиеся при чистке: износ материала, слабый клей, нестойкие красители, ранее проведённый ремонт.',
    'Полное удаление застарелых и сложных загрязнений не гарантируется.',
    'Обувь выдаётся по номеру наряд-заказа или по телефону клиента. Бесплатное хранение после уведомления о готовности — 30 дней.',
    'Подписывая наряд-заказ, клиент соглашается с условиями оказания услуги.']
};
const MAX_PHOTOS=6;

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Math.round(+n||0)).toLocaleString('ru-RU')+' ₸';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const normPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);if(d.length===10)d='7'+d;return d};
const CODES=[{c:'7',n:'🇰🇿 +7',len:10},{c:'996',n:'🇰🇬 +996',len:9},{c:'998',n:'🇺🇿 +998',len:9},{c:'992',n:'🇹🇯 +992',len:9},{c:'993',n:'🇹🇲 +993',len:8},{c:'994',n:'🇦🇿 +994',len:9},{c:'90',n:'🇹🇷 +90',len:10},{c:'86',n:'🇨🇳 +86',len:11},{c:'971',n:'🇦🇪 +971',len:9},{c:'',n:'🌍 Другая',len:0}];
const codeInfo=cc=>CODES.find(x=>x.c===cc)||CODES[CODES.length-1];
/* В базе номер хранится только цифрами с кодом страны: 77071234567, 996555123456 — без +, пробелов и 8 */
function fullPhone(cc,local){let d=String(local||'').replace(/\D/g,'');
  if(cc==='7'){if(d.length===11&&(d[0]==='8'||d[0]==='7'))d=d.slice(1)}
  else if(cc&&d.startsWith(cc)&&d.length>codeInfo(cc).len)d=d.slice(cc.length);
  return cc+d}
function phoneOk(cc,local){const full=fullPhone(cc,local),ci=codeInfo(cc);return ci.len?full.length===cc.length+ci.len:full.length>=10&&full.length<=15}
function splitPhone(d){d=String(d||'').replace(/\D/g,'');const m=[...CODES].filter(x=>x.c).sort((a,b)=>b.c.length-a.c.length).find(x=>d.startsWith(x.c)&&d.length===x.c.length+x.len);return m?{cc:m.c,phone:d.slice(m.c.length)}:{cc:'',phone:d}}
function fmtLocal(cc,d){d=d.replace(/\D/g,'');if(cc==='7'){d=d.slice(0,10);return [d.slice(0,3),d.slice(3,6),d.slice(6,8),d.slice(8,10)].filter(Boolean).join(' ')}
  return d.replace(/(\d{3})(?=\d)/g,'$1 ')}
const fmtPhone=d=>{if(!d)return'';const p=splitPhone(d);return p.cc?`+${p.cc} ${fmtLocal(p.cc,p.phone)}`:'+'+d};
const fmtDate=t=>t?new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const st=k=>STATUSES.find(s=>s.k===k)||STATUSES[0];
const blob=id=>'/_blob/'+encodeURIComponent(id);
const tabId=Math.random().toString(36).slice(2);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2400)}
function paid(o){return (o.payments||[]).reduce((a,p)=>a+(+p.amount||0),0)}
function payState(o){const p=paid(o),t=+o.total||0;if(t<=0&&p<=0)return{k:'pay-ok',n:'Без оплаты'};if(p>=t)return{k:'pay-ok',n:'Оплачен'};if(p>0)return{k:'pay-part',n:'Частично'};return{k:'pay-no',n:'Не оплачен'}}

/* ===================== Подключение к базе ===================== */
let loadTimer=setTimeout(()=>{if(!S.live){$('#sync').textContent='нет связи с базой';}},10000);
(async function init(){
  renderPoints(); go(S.tab);
  if(!window.claude||!claude.use){$('#sync').textContent='база недоступна';return}
  const [db,user,assets]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('assets')]);
  S.db=db;S.assets=assets;
  if(user){try{S.uid=await user.id()}catch(e){} try{const c=await user.can('data.write'); if(c===false)S.canWrite=false}catch(e){}}
  S.ready=true;
  if(!db){$('#sync').textContent='нет доступа к базе';clearTimeout(loadTimer);rerender();return}
  rerender();
  db.doc('config/main').onSnapshot(s=>{S.cfgDoc=s.exists?s.data():{};renderPoints();if(S.tab==='new'&&!document.activeElement?.closest?.('#view'))rerender();else if(S.tab==='settings'&&!document.activeElement?.closest?.('#view'))rerender()},onErr);
  db.collection('orders').orderBy('createdAt','desc').limit(800).onSnapshot(s=>{
    S.orders=s.docs.map(d=>({id:d.id,...d.data()}));
    if(!s.metadata.fromCache){S.live=true;clearTimeout(loadTimer);const el=$('#sync');el.textContent='● онлайн';el.className='on'}
    refresh();
  },onErr);
  db.collection('clients').orderBy('updatedAt','desc').limit(1000).onSnapshot(s=>{S.clients=s.docs.map(d=>({id:d.id,...d.data()}));refresh()},onErr);
})();
function rerender(){const y=window.scrollY;go(S.tab,true);window.scrollTo(0,y)}
function dbBanner(){if(!S.ready||S.db)return'';return`<div class="banner">Нет подключения к базе данных, поэтому сохранять нельзя. Откройте приложение по ссылке в браузере или в приложении Claude, войдя в свой аккаунт. Сотрудникам нужен доступ уровня «Contributor» или выше.</div>`}
function onErr(e){clearTimeout(loadTimer);$('#sync').textContent='ошибка базы: '+(e&&e.code||'');}
function refresh(){if(S.tab==='orders')renderOrders();else if(S.tab==='clients')renderClients();else if(S.tab==='cash')renderCash();

function go(tab,keep){
  if(S.tab==='new'&&tab!=='new'&&S.form&&S.form.dirty&&!keep){/* оставляем черновик */}
  S.tab=tab;$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='orders')renderOrders();else if(tab==='new')renderNew();else if(tab==='clients')renderClients();else if(tab==='cash')renderCash();else renderSettings();
  if(!keep)window.scrollTo(0,0);

function suggestedTariff(f){return f.materials.some(m=>DELICATE.includes(m))?'PREMIUM':'STANDARD'}
function calc(f){const c=cfg();const t=c.tariffs.find(x=>x.name===f.tariff)||{price:0};
  const svc=f.services.map(n=>c.services.find(s=>s.name===n)).filter(Boolean);
  const sub=(+t.price||0)+svc.reduce((a,s)=>a+(+s.price||0),0);
  const disc=Math.round(sub*(Math.min(100,Math.max(0,+f.discountPct||0)))/100);
  const bonus=Math.min(Math.max(0,+f.bonusUsed||0),f.clientBonus||0,sub-disc);
  return{tariffPrice:+t.price||0,svc,sub,disc,bonus,total:Math.max(0,sub-disc-bonus)}}

function lookupClient(fromTyping){
  const f=S.form,d=fullPhone(f.cc,f.phone),box=$('#clientInfo');if(!box)return;
  if(!phoneOk(f.cc,f.phone)){box.innerHTML='';f.clientExists=false;f.clientBonus=0;return}
  const cl=S.clients.find(c=>c.id===d);
  const done=cl=>{
    if(cl){f.clientExists=true;f.clientBonus=+cl.bonus||0;
      if(fromTyping||!f.first){f.first=cl.first||'';f.last=cl.last||'';f.instagram=cl.instagram||'';$('#fFirst').value=f.first;$('#fLast').value=f.last;$('#fIg').value=f.instagram}
      const n=S.orders.filter(o=>o.clientPhone===d).length;
      box.innerHTML=`<div class="found"><span class="av" style="background:#fff">${esc((cl.first||'?')[0])}</span><div>Постоянный клиент: ${esc(cl.first||'')} ${esc(cl.last||'')}<div class="small" style="font-weight:500">${n} заказ(ов) · бонусы ${money(cl.bonus)}</div></div></div>`;
      const bi=$('#fBonus');if(bi){bi.disabled=!(f.clientBonus>0);bi.closest('label').firstChild.textContent=`Бонусы (есть ${money(f.clientBonus)})`}
    }else{f.clientExists=false;f.clientBonus=0;box.innerHTML='<div class="found newc">Новый клиент — будет создан при оформлении</div>'}
  };
  if(cl)return done(cl);
  if(S.db){S.db.doc('clients/'+d).get().then(s=>{if(fullPhone(S.form.cc,S.form.phone)===d)done(s.exists?{id:d,...s.data()}:null)}).catch(()=>done(null))}else done(null);
}
function renderPhotos(){const el=$('#fPhotos');if(!el)return;const f=S.form;
  const used=f.photos.length+f.uploading,left=MAX_PHOTOS-used;
  const cnt=$('#phCount');if(cnt)cnt.textContent=`${f.photos.length} из ${MAX_PHOTOS}`;
  el.innerHTML=f.photos.map((id,i)=>`<div class="ph"><img src="${blob(id)}" data-lb alt=""><button class="x" data-rm="${i}">✕</button></div>`).join('')
   +Array.from({length:f.uploading},()=>'<div class="ph loading">загрузка…</div>').join('')
   +Array.from({length:Math.max(0,left)},(_,i)=>`<label class="addph"><input type="file" accept="image/*" multiple hidden class="phIn"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>${PHOTO_HINTS[used+i]||'Фото'}</span></label>`).join('');
  $$('[data-lb]',el).forEach(i=>i.onclick=()=>lightbox(i.src));
  $$('[data-rm]',el).forEach(b=>b.onclick=()=>{f.photos.splice(+b.dataset.rm,1);renderPhotos()});
  $$('.phIn',el).forEach(inp=>inp.onchange=async e=>{
    let files=[...e.target.files];if(!files.length)return;
    const room=MAX_PHOTOS-f.photos.length-f.uploading;
    if(files.length>room){toast(`Можно добавить ещё ${room} фото — лишние пропущены`);files=files.slice(0,room)}
    if(!files.length)return;
    mark();f.uploading+=files.length;renderPhotos();
    await Promise.all(files.map(async file=>{
      try{const r=await S.assets.upload(await compress(file));f.photos.push(r.id)}
      catch(err){toast('Фото не загрузилось'+(err&&err.message?': '+err.message:''))}
      f.uploading--;renderPhotos()}));
  });

async function compress(file){try{const bmp=await createImageBitmap(file);const s=Math.min(1,1600/Math.max(bmp.width,bmp.height));

  return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',0.82))}catch(e){return file}}

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function makePdf(o,btn){
  const dl=await claude.use('downloads');if(!dl)return toast('Скачивание недоступно в этом окне');
  btn.disabled=true;const old=btn.textContent;btn.textContent='Готовлю PDF…';
  let wrap;
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    wrap=document.createElement('div');wrap.id='nzCapture';wrap.innerHTML=nzHTML(o);document.body.appendChild(wrap);
    await Promise.all($$('img',wrap).map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const canvas=await html2canvas(wrap.firstElementChild,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4'});
    const pw=210,ph=297,imgH=canvas.height*pw/canvas.width;
    const pageCanvasH=Math.floor(canvas.width*ph/pw);
    for(let y=0,pg=0;y<canvas.height;y+=pageCanvasH,pg++){
      const part=document.createElement('canvas');part.width=canvas.width;part.height=Math.min(pageCanvasH,canvas.height-y);
      const ctx=part.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,part.width,part.height);ctx.drawImage(canvas,0,-y);
      if(pg>0)pdf.addPage();pdf.addImage(part.toDataURL('image/jpeg',0.92),'JPEG',0,0,pw,part.height*pw/part.width);
    }
    const blobOut=pdf.output('blob');
    await dl.save({filename:`Наряд-заказ ${o.number}.pdf`,data:blobOut});
  }catch(e){if(e&&e.code==='declined'){}else toast('PDF не получился'+(e&&e.message?': '+e.message:''))}
  finally{if(wrap)wrap.remove();btn.disabled=false;btn.textContent=old}
}

function periodStart(p){const d=new Date();d.setHours(0,0,0,0);if(p==='week')d.setDate(d.getDate()-6);if(p==='month')d.setDate(1);return d.getTime()}

  const orders=S.orders.filter(inPoint);
  const pays=[];S.orders.forEach(o=>(o.payments||[]).forEach(p=>{if(p.at>=from&&(S.point==='__all'||(p.point||o.point)===S.point))pays.push({...p,o})}));
  const rev=pays.reduce((a,p)=>a+(+p.amount||0),0);
  const created=orders.filter(o=>o.createdAt>=from&&o.status!=='cancel');
  const avg=created.length?created.reduce((a,o)=>a+(+o.total||0),0)/created.length:0;
  const debt=orders.filter(o=>o.status!=='cancel').reduce((a,o)=>a+Math.max(0,(+o.total||0)-paid(o)),0);
  const group=(arr,key,val)=>{const m={};arr.forEach(x=>{const k=key(x)||'—';m[k]=(m[k]||0)+val(x)});return Object.entries(m).sort((a,b)=>b[1]-a[1])};

  const doneP=S.orders.filter(o=>o.readyAt>=from&&o.status!=='cancel'&&(S.point==='__all'||o.point===S.point));
  const byMaster=group(doneP,o=>o.master||'Не указан',()=>1);

   <div class="kpi"><div class="l">Новых заказов</div><div class="v">${created.length}</div></div>
   <div class="kpi"><div class="l">Средний чек</div><div class="v">${money(avg)}</div></div>
   <div class="kpi"><div class="l">Долг клиентов (все)</div><div class="v" style="color:${debt>0?'var(--bad)':'inherit'}">${money(debt)}</div></div></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">
   <div class="card"><h3>По способу оплаты</h3>${bars(group(pays,p=>p.method,p=>+p.amount||0))}</div>
   <div class="card"><h3>По точкам</h3>${bars(group(pays,p=>p.point||p.o.point,p=>+p.amount||0))}</div>
   <div class="card"><h3>Каналы продаж (новые заказы)</h3>${bars(group(created,o=>o.channel||'Не указан',()=>1),v=>v+' шт.')}</div>
   <div class="card"><h3>Тарифы (новые заказы)</h3>${bars(group(created,o=>o.tariff,()=>1),v=>v+' шт.')}</div>
   <div class="card"><h3>Мастера: готово пар и сдельная часть</h3>${bars(byMaster,v=>v+' пар · '+money(v*(+c.masterRate||0)))}
     <div class="small muted" style="margin-top:8px">Ставка ${money(c.masterRate)} за пару${c.masterFixed?' + фикс '+money(c.masterFixed)+' в месяц':''}. Меняется в настройках.</div></div>
  </div>
  <div class="small muted" style="margin-top:12px">Считаются последние ${S.orders.length} заказов в базе.</div>`;
  $('#per').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.period=b.dataset.p;renderCash()};
}

/* ===================== Настройки ===================== */
function renderSettings(){
  const c=cfg();const ro=!S.canWrite||!S.db;
  const lines=a=>a.join('\n');const priced=a=>a.map(x=>`${x.name} = ${x.price}`).join('\n');
  $('#view').innerHTML=`<h1>Настройки</h1>
  ${ro?'<div class="banner">Изменять настройки может только тот, у кого есть права на запись.</div>':''}
  <div class="stack">
  <div class="card stack"><h2>Прайс</h2>
   <label class="f">Тарифы — по строке «НАЗВАНИЕ = цена»<textarea id="sT" rows="5">${esc(priced(c.tariffs))}</textarea></label>
   <label class="f">Доп. услуги — «Название = цена»<textarea id="sS" rows="7">${esc(priced(c.services))}</textarea></label></div>
  <div class="card stack"><h2>Точки и сотрудники</h2>
   <label class="f">Точки — по одной в строке<textarea id="sP" rows="5">${esc(lines(c.points))}</textarea></label>
   <div class="grid2"><label class="f">Мастера<textarea id="sM" rows="3">${esc(lines(c.masters))}</textarea></label>
   <label class="f">Менеджеры<textarea id="sG" rows="3">${esc(lines(c.managers))}</textarea></label></div>
   <div class="grid3"><label class="f">Боксов на точке<input type="number" id="sB" value="${+c.boxes||0}"></label>
   <label class="f">Мастеру за пару, ₸<input type="number" id="sR" value="${+c.masterRate||0}"></label>
   <label class="f">Фикс мастера, ₸<input type="number" id="sX" value="${+c.masterFixed||0}"></label></div></div>
  <div class="card stack"><h2>Наряд-заказ</h2>
   <div class="grid2"><label class="f">Название<input type="text" id="sCo" value="${esc(c.company)}"></label>
   <label class="f">Телефон для клиентов<input type="text" id="sCp" value="${esc(c.companyPhone||'')}" placeholder="+7 7__ ___ __ __"></label></div>
   <label class="f">Строка под названием (адрес, сайт, Instagram)<input type="text" id="sCi" value="${esc(c.companyInfo||'')}"></label>
   <label class="f">Условия — каждый пункт с новой строки<textarea id="sTm" rows="7">${esc(lines(c.terms||[]))}</textarea></label></div>
  <div class="card stack"><h2>Каналы продаж и бренды</h2>
   <label class="f">Каналы — по одному в строке<textarea id="sC" rows="6">${esc(lines(c.channels))}</textarea></label>
   <label class="f">Свои бренды (добавляются и автоматически при приёме)<textarea id="sE" rows="4">${esc(lines(c.extraBrands||[]))}</textarea></label>
   <div class="small muted">В базе уже ${BRANDS_BASE.length} брендов: спорт, люкс, масс-маркет, трекинг и обувные марки.</div></div>
  ${ro?'':'<button class="btn primary block" id="sSave">Сохранить настройки</button>'}
  </div>`;
  const b=$('#sSave');if(!b)return;
  b.onclick=async()=>{
    const L=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
    const P=id=>L(id).map(s=>{const m=s.split('=');return{name:m[0].trim(),price:Math.round(+String(m[1]||'0').replace(/\D/g,'')||0)}}).filter(x=>x.name);
    const data={tariffs:P('#sT'),services:P('#sS'),points:L('#sP'),masters:L('#sM'),managers:L('#sG'),channels:L('#sC'),extraBrands:L('#sE'),
      boxes:Math.max(0,Math.min(300,Math.round(+$('#sB').value||0))),masterRate:Math.round(+$('#sR').value||0),masterFixed:Math.round(+$('#sX').value||0),
      company:$('#sCo').value.trim()||'Clean Republic',companyPhone:$('#sCp').value.trim(),companyInfo:$('#sCi').value.trim(),terms:L('#sTm')};
    if(!data.tariffs.length||!data.points.length)return toast('Нужен хотя бы один тариф и одна точка');
    b.disabled=true;try{await S.db.doc('config/main').set(data);toast('Настройки сохранены')}catch(e){handleWriteErr(e)}b.disabled=false};
}
</script>
</body>
</html>
